<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paxve</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; background: #f0fdfa; color: #134e4a; padding: 24px; }
      .card { max-width: 420px; width: 100%; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px;
              box-shadow: 0 4px 24px rgba(15, 118, 110, .12); }
      .logo { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
      button { width: 100%; border: 0; border-radius: 10px; background: #0f766e; color: #fff; font-size: 17px; padding: 14px; font-family: inherit; }
      button:active { background: #115e59; }
      .langs { margin-top: 18px; display: flex; gap: 8px; justify-content: center; }
      .langs a { color: #0f766e; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 14px; }
      .langs a.on { background: #ccfbf1; }
      .status { font-size: 13px; color: #94a3b8; margin-top: 12px; min-height: 1em; }
    </style>
  </head>
  <body>
    <!-- Shown by Capacitor (server.errorPath) when https://paxve.com cannot be reached and nothing is cached yet. -->
    <div class="card">
      <svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0B1F3A"/><g transform="translate(0 0) scale(1)"><path d="M20.5 23h23a3.5 3.5 0 0 1 0 7h-23a3.5 3.5 0 0 1 0-7z M31 44h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="#fff"/><path d="M26.5 12h11a3.5 3.5 0 0 1 0 7h-11a3.5 3.5 0 0 1 0-7z M14.5 34h35a3.5 3.5 0 0 1 0 7h-35a3.5 3.5 0 0 1 0-7z" fill="#2DD4BF"/></g></svg>
      <h1 id="title"></h1>
      <p id="body"></p>
      <button id="retry" type="button"></button>
      <div class="status" id="status"></div>
      <div class="langs">
        <a href="#" data-l="ar">العربية</a><a href="#" data-l="en">English</a><a href="#" data-l="fr">Français</a>
      </div>
    </div>
    <script>
      var T = {
        en: { title: 'No connection', body: 'Paxve could not reach the server. Check Wi-Fi or mobile data, then try again. Payments you already saved on this phone are kept and will be sent automatically.', retry: 'Try again', wait: 'Connecting…', still: 'Still offline. Retrying automatically…' },
        ar: { title: 'لا يوجد اتصال', body: 'تعذّر على Paxve الوصول إلى الخادم. تحقّق من الواي فاي أو بيانات الهاتف ثم أعد المحاولة. الدفعات المحفوظة على هذا الهاتف باقية وستُرسَل تلقائياً.', retry: 'أعد المحاولة', wait: 'جارٍ الاتصال…', still: 'لا يزال الاتصال مقطوعاً. ستتم إعادة المحاولة تلقائياً…' },
        fr: { title: 'Pas de connexion', body: "Paxve n'a pas pu joindre le serveur. Vérifiez le Wi-Fi ou les données mobiles puis réessayez. Les paiements déjà enregistrés sur ce téléphone sont conservés et seront envoyés automatiquement.", retry: 'Réessayer', wait: 'Connexion…', still: 'Toujours hors ligne. Nouvel essai automatique…' }
      };
      var APP = 'https://paxve.com/#/login';
      var lang = 'en';
      try { lang = localStorage.getItem('paxve.offline.lang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
      if (!T[lang]) lang = 'en';
      function render() {
        var t = T[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('title').textContent = t.title;
        document.getElementById('body').textContent = t.body;
        document.getElementById('retry').textContent = t.retry;
        var links = document.querySelectorAll('.langs a');
        for (var i = 0; i < links.length; i++) links[i].className = links[i].getAttribute('data-l') === lang ? 'on' : '';
      }
      document.querySelector('.langs').addEventListener('click', function (e) {
        var l = e.target.getAttribute && e.target.getAttribute('data-l');
        if (!l) return;
        e.preventDefault();
        lang = l;
        try { localStorage.setItem('paxve.offline.lang', l); } catch (err) {}
        render();
      });
      var busy = false;
      function retry(auto) {
        if (busy) return;
        busy = true;
        var st = document.getElementById('status');
        st.textContent = T[lang].wait;
        // probe first so a failed attempt keeps this page instead of a blank WebView error
        fetch('https://paxve.com/api/health', { cache: 'no-store', mode: 'no-cors' })
          .then(function () { location.replace(APP); })
          .catch(function () { st.textContent = T[lang].still; busy = false; });
      }
      document.getElementById('retry').addEventListener('click', function () { retry(false); });
      window.addEventListener('online', function () { retry(true); });
      setInterval(function () { retry(true); }, 15000);
      render();
    </script>
  </body>
</html>
